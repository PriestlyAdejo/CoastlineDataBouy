# Conda environment for MECH0073 Coastal Buoy development.
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Then run scripts/setup_env_windows.bat to install editable backend/edge packages and frontend deps.

name: buoy-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
