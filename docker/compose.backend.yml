services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nereus
      POSTGRES_PASSWORD: nereus
      POSTGRES_DB: nereus
    ports:
      - "5432:5432"
    volumes:
      - nereus_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nereus -d nereus"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: MECH0073BUOYADMIN
      MINIO_ROOT_PASSWORD: "andrea@67_69_420"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nereus_minio:/data

volumes:
  nereus_pg:
  nereus_minio: